
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro | Amigo de Pata</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
    <h1>Amigo de Pata</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="animais.html">Animais</a>
    </nav>
</header>

<main class="container">

    <div class="abas-acesso">

        <button type="button" id="mostrarCadastro"
                class="aba ativa">
            Criar cadastro
        </button>

        <button type="button" id="mostrarLogin"
                class="aba">
            Já tenho conta
        </button>

    </div>

    <form id="formCadastro" class="formulario">

        <h2>Crie sua conta!</h2>

        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <label>E-mail</label>
        <input type="email" id="emailCadastro" required>

        <label>Senha</label>
        <input type="password" id="senhaCadastro"
               minlength="6" required>

        <button type="submit" class="botao">
            Cadastrar
        </button>

    </form>

    <form id="formLogin" class="formulario escondido">

        <h2>Bem-vindo de volta!</h2>

        <label>E-mail</label>
        <input type="email" id="emailLogin" required>

        <label>Senha</label>
        <input type="password" id="senhaLogin" required>

        <button type="submit" class="botao">
            Entrar
        </button>

    </form>

</main>

<script src="script.js"></script>

</body>
</html>
